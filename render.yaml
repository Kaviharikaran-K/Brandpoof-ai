# Render Blueprint for the BrandProof AI backend (FastAPI).
# DATABASE_URL (Neon PostgreSQL) and CORS_ORIGINS (Vercel frontend URL)
# are set in the Render dashboard; SECRET_KEY is generated by Render.

services:
  - type: web
    name: brandproof-ai
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python seed.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "10"
